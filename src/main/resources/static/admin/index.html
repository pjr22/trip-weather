<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console</title>
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="shell">
        <header class="shell-header">
            <span class="title">Trip Weather — Admin</span>
            <span>
                <span class="who" id="admin-who"></span>
                <button id="admin-logout">Sign out</button>
            </span>
        </header>
        <nav class="shell-nav">
            <a href="#routes"    data-view="routes"  class="active">Routes</a>
            <a href="#favorites" data-view="favorites">Favorites</a>
            <a href="#data"      data-view="data">Data</a>
            <a href="#metrics"   data-view="metrics">Metrics</a>
            <a href="#users"     data-view="users">Users</a>
        </nav>
        <main class="shell-main">
            <div id="view-root"></div>
        </main>
    </div>

    <div id="admin-confirm-modal" class="admin-modal" role="dialog" aria-modal="true"
         aria-labelledby="admin-confirm-modal-title" hidden>
        <div class="admin-modal-card">
            <header class="admin-modal-header">
                <h2 id="admin-confirm-modal-title">Confirm</h2>
            </header>
            <div class="admin-modal-body">
                <p id="admin-confirm-modal-message"></p>
            </div>
            <footer class="admin-modal-actions">
                <button id="admin-confirm-modal-cancel" type="button">Cancel</button>
                <button id="admin-confirm-modal-ok" class="primary" type="button">OK</button>
            </footer>
        </div>
    </div>

    <script src="../js/utils/Toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/AdminUI.js"></script>
    <script src="js/managers/RoutesView.js"></script>
    <script src="js/managers/FavoritesView.js"></script>
    <script src="js/managers/DataView.js"></script>
    <script src="js/managers/MetricsView.js"></script>
    <script src="js/managers/UsersView.js"></script>
    <script src="js/AdminApp.js"></script>
</body>
</html>
