spring.application.name=tripweather

# Server configuration
server.port=8090

# Database configuration (PostGIS)
# TRIP_DB_PASSWORD must be set in the environment; URL and username fall back to local defaults.
spring.datasource.url=${TRIP_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${TRIP_DB_USERNAME:postgres}
spring.datasource.password=${TRIP_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
# Default is 'validate': Hibernate checks the DB schema matches entities and fails fast on mismatch.
# When making an entity change that requires a schema update, set TRIP_JPA_DDL=update for a single
# startup so Hibernate applies the change, then revert to 'validate' (or unset the env var).
# See CODE_REVIEW.md P0 #4 for the planned future migration to Flyway-managed schema changes.
spring.jpa.hibernate.ddl-auto=${TRIP_JPA_DDL:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spatial data configuration
spring.jpa.properties.hibernate.spatial.jdbc.org.hibernate.spatial.JTS=org.hibernate.spatial.dialect.postgis.PostgisDialect

# OpenRouteService configuration
openrouteservice.api.key="set with OPENROUTESERVICE_API_KEY env variable"
openrouteservice.base.url=https://api.openrouteservice.org

# GeoApify configuration
geoapify.api.key="set with GEOAPIFY_API_KEY environment variable"
geoapify.base.url=https://api.geoapify.com/v1

# NREL API configuration
nrel.api.key="set with NREL_API_KEY environment variable"
# NREL rebranded to NLR; the legacy developer.nrel.gov host now returns 410
# Gone for the alt-fuel-stations endpoint. Existing NREL API keys are honored
# at the new host (the rebrand kept the auth surface compatible).
nrel.base.url=https://developer.nlr.gov

# Rate limiting for third-party API proxy endpoints (per client IP).
# Override with TRIP_RATELIMIT_ENABLED / TRIP_RATELIMIT_REQUESTS_PER_MINUTE.
trip.ratelimit.enabled=${TRIP_RATELIMIT_ENABLED:true}
trip.ratelimit.requests-per-minute=${TRIP_RATELIMIT_REQUESTS_PER_MINUTE:120}

# Content-Security-Policy enforcement. When false, violations are sent as
# Content-Security-Policy-Report-Only (logged to browser console, not blocked) — useful
# for diagnosing breakage after a policy change without redeploying.
trip.csp.enforce=${TRIP_CSP_ENFORCE:true}

# Session cookie settings. Defaults assume production (HTTPS via haproxy);
# set TRIP_COOKIE_SECURE=false in local dev to allow plain-HTTP sessions.
server.servlet.session.cookie.secure=${TRIP_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Make Tomcat emit path-only Location headers on redirects (e.g.
# "Location: /admin/") rather than absolute URLs ("Location:
# http://host:port/admin/"). Critical when a reverse proxy fronts the app:
# nginx and haproxy both rewrite absolute upstream Location headers through
# their default proxy_redirect / http-response set-header rules, which can
# silently drop the client-facing port if the proxy's server_name lacks one.
# Path-only Location headers bypass that machinery — the browser resolves
# them against the URL it requested, preserving scheme/host/port verbatim.
server.tomcat.use-relative-redirects=true

# Email sending (Mailtrap REST API).
# trip.email.url and trip.email.api-key have blank defaults because they're
# environment-specific secrets — fail fast at startup if not provided.
# trip.email.enabled=false short-circuits the send and just logs at INFO; use
# this in local dev when no Mailtrap inbox is configured yet.
trip.email.url=${TRIP_EMAIL_URL:}
trip.email.api-key=${TRIP_EMAIL_APIKEY:}
trip.email.from=${TRIP_EMAIL_FROM:tripweather@pjr22.com}
trip.email.from-name=${TRIP_EMAIL_FROM_NAME:Trip Weather}
trip.email.enabled=${TRIP_EMAIL_ENABLED:true}

# Base URL used to construct user-facing links inside emails (verification,
# password reset). Defaults to the production hostname; override locally with
# TRIP_APP_BASE_URL=http://localhost:8090.
trip.app.base-url=${TRIP_APP_BASE_URL:https://tripweather.pjr22.com}

# Scheduled cleanup of guest-owned routes (Phase 5 of USER_ACCOUNTS_PLAN.md;
# became two-stage in Phase 1 of ADMIN_CONSOLE.md).
#
# Stage 1 — soft-delete guest-owned routes older than retention. Authenticated
# users' routes are NEVER auto-soft-deleted; only the shared guest bucket ages
# out. Defaults: enabled, 30-day retention, daily at 03:00 server-local time.
#
# Stage 2 — hard-delete ANY soft-deleted route past the grace window. This is
# the path by which an admin's manual soft-delete eventually becomes permanent:
# 7-day undo window, then the row + waypoints go via ON DELETE CASCADE. Always
# runs (no enable gate) — the grace window is what makes soft-delete reversible
# in the first place.
#
# The same cron also sweeps expired email-verification and password-reset tokens.
#
# To verify locally with quick turnaround:
#   export ROUTE_CLEANUP_RETENTION_DAYS=0
#   export ROUTE_CLEANUP_PURGE_GRACE_DAYS=0
#   export ROUTE_CLEANUP_CRON='*/30 * * * * *'
# A freshly-saved guest route will then soft-delete and hard-delete within 30 seconds.
route.cleanup.enabled=${ROUTE_CLEANUP_ENABLED:true}
route.cleanup.guest-route-retention-days=${ROUTE_CLEANUP_RETENTION_DAYS:30}
route.cleanup.purge-grace-days=${ROUTE_CLEANUP_PURGE_GRACE_DAYS:7}
route.cleanup.cron=${ROUTE_CLEANUP_CRON:0 0 3 * * *}

# "Stay logged in for 30 days" persistent-token remember-me. Phase 4 of
# USER_ACCOUNTS_PLAN.md.
#
# trip.auth.remember-me.key has a blank default because it's a per-environment
# secret that signs the persistent cookies. StartupConfigValidator fails fast
# at boot if remember-me is enabled but the key is missing — same pattern as
# the email URL/key. Disable locally with TRIP_REMEMBER_ME_ENABLED=false.
trip.auth.remember-me.enabled=${TRIP_REMEMBER_ME_ENABLED:true}
trip.auth.remember-me.key=${TRIP_REMEMBER_ME_KEY:}

# Lifetime of email-delivered tokens (sign-up verification, forgot-password
# reset) in minutes. Five minutes by default — short enough to limit the
# window an intercepted email link is usable, long enough that an actively-
# waiting user receives the mail and clicks in time. Bump up if real-world
# delivery latency makes 5 min too tight in practice.
trip.auth.email-token.lifetime-minutes=${TRIP_AUTH_EMAIL_TOKEN_LIFETIME_MINUTES:5}

# Phase 1 of LOCAL_CACHING_HOSTING.md — api.weather.gov caching.
#
# trip.weather.forecast-ttl-minutes: fallback freshness window when a
# response lacks the NWS-published updateTime. When updateTime IS present,
# entries are considered fresh until updateTime + 1 hour (NWS publishes new
# forecasts roughly hourly).
#
# trip.weather.forecast-stale-max-hours: past freshness, if upstream is
# unreachable, serve the cached entry up to this age. Past it, fail with an
# error rather than risk serving misleading old weather.
#
# trip.weather.forecast-cache-max: Caffeine maximum entries.
#
# trip.weather.gridpoint-refresh-days: durable nws_gridpoints cache entries
# older than this trigger a synchronous refresh on read. NWS gridpoint
# polygons change very rarely; long default.
trip.weather.forecast-ttl-minutes=${TRIP_WEATHER_FORECAST_TTL_MINUTES:30}
trip.weather.forecast-stale-max-hours=${TRIP_WEATHER_FORECAST_STALE_MAX_HOURS:6}
trip.weather.forecast-cache-max=${TRIP_WEATHER_FORECAST_CACHE_MAX:10000}
trip.weather.gridpoint-refresh-days=${TRIP_WEATHER_GRIDPOINT_REFRESH_DAYS:90}

# Phase 2 of LOCAL_CACHING_HOSTING.md — Geoapify + OpenRouteService caching.
#
# Geoapify reverse geocode: durable PostGIS cache. The radius defines how
# close two map clicks must be (meters) to share a cached address; 15 m is
# tight enough to give per-building precision while absorbing pixel jitter.
# Refresh-days is how long an entry is considered fresh; addresses change
# rarely, so a one-year default is plenty.
#
# Geoapify forward geocode (search box): in-memory Caffeine, plain TTL,
# no stale-on-error (search results are nice-to-have).
trip.geocode.reverse-radius-meters=${TRIP_GEOCODE_REVERSE_RADIUS_METERS:15}
trip.geocode.reverse-refresh-days=${TRIP_GEOCODE_REVERSE_REFRESH_DAYS:365}
trip.geocode.forward-cache-max=${TRIP_GEOCODE_FORWARD_CACHE_MAX:1000}
trip.geocode.forward-cache-ttl-hours=${TRIP_GEOCODE_FORWARD_CACHE_TTL_HOURS:24}

# OpenRouteService response cache (durable, Postgres). Per-endpoint TTLs
# differ because routes can subtly change with road network updates while
# snap + elevation are essentially geological. Stale-max windows govern
# how long a stale entry can be served when upstream is unreachable.
trip.routing.directions-ttl-hours=${TRIP_ROUTING_DIRECTIONS_TTL_HOURS:24}
trip.routing.directions-stale-max-hours=${TRIP_ROUTING_DIRECTIONS_STALE_MAX_HOURS:168}
trip.routing.snap-ttl-hours=${TRIP_ROUTING_SNAP_TTL_HOURS:720}
trip.routing.snap-stale-max-hours=${TRIP_ROUTING_SNAP_STALE_MAX_HOURS:2160}
trip.routing.elevation-ttl-hours=${TRIP_ROUTING_ELEVATION_TTL_HOURS:720}
trip.routing.elevation-stale-max-hours=${TRIP_ROUTING_ELEVATION_STALE_MAX_HOURS:2160}

# Phase 3 of LOCAL_CACHING_HOSTING.md — NREL data mirror.
#
# The ev_stations table is a local mirror of the NREL Alternative Fuels Data
# Center electric-station feed. EvStationLoader refreshes it on the cron, on
# startup if the table is empty, and 1 hour after any failed run (until one
# succeeds). NREL_API_KEY is now used only by the loader; no upstream call
# happens on the user-facing request path.
#
# trip.ev.loader-enabled                — master switch for both the cron and
#                                          the bootstrap-on-empty trigger.
# trip.ev.loader-cron                   — when the weekly refresh runs
#                                          (Spring cron format: sec min hr ...).
# trip.ev.loader-bootstrap-on-empty     — load synchronously soon after startup
#                                          when ev_stations is empty.
# trip.ev.default-radius-miles          — fallback search radius along the
#                                          route when the request omits
#                                          'distance'. Matches NREL's default.
# trip.ev.default-limit                 — fallback result cap when the request
#                                          omits 'limit'. Matches NREL's default.
trip.ev.loader-enabled=${TRIP_EV_LOADER_ENABLED:true}
trip.ev.loader-cron=${TRIP_EV_LOADER_CRON:0 0 4 * * MON}
trip.ev.loader-bootstrap-on-empty=${TRIP_EV_LOADER_BOOTSTRAP_ON_EMPTY:true}
trip.ev.default-radius-miles=${TRIP_EV_DEFAULT_RADIUS_MILES:1.0}
trip.ev.default-limit=${TRIP_EV_DEFAULT_LIMIT:200}

# Spring Boot Actuator exposure. Phase 5 of LOCAL_CACHING_HOSTING.md uses
# Micrometer counters under trip.routing.*; /actuator/metrics/{name} returns
# them as JSON. Only metrics + health are exposed; everything else (env,
# beans, configprops, ...) stays hidden by default. The endpoints share the
# main server port — haproxy must NOT route /actuator/** from the public
# frontend (the SecurityConfig rule below also denies anonymous access as
# defence in depth).
management.endpoints.web.exposure.include=metrics,health,prometheus
management.endpoint.health.show-details=never

# Phase 3 of ADMIN_CONSOLE.md — the Metrics tab shows p50/p95/p99 of
# http.server.requests. Two Micrometer properties are needed, easily confused:
#
#   * percentiles.<meter>          → populates Timer.takeSnapshot()
#                                    .percentileValues() with pre-aggregated
#                                    server-side percentile values. This is
#                                    what MetricsSnapshotService.percentileMs
#                                    reads to build the admin panel; without
#                                    it the snapshot reports zeros.
#   * percentiles-histogram.<meter> → publishes histogram buckets to
#                                    /actuator/prometheus so external
#                                    Prometheus/Grafana can compute custom
#                                    percentiles client-side via
#                                    histogram_quantile() on the bucket
#                                    counts. Does NOT populate
#                                    percentileValues().
#
# Both are enabled so the admin console works AND the Prometheus scrape
# stays useful for ad-hoc percentile queries. Only the HTTP server timer
# carries either flag; every other Timer in the app stays summary-only to
# keep the meter registry small.
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Phase 4 of LOCAL_CACHING_HOSTING.md — tile / WMS / forecast-icon proxy.
#
# trip.tile.proxy-enabled: master switch. When false (the dev default), the
# frontend, the WeatherService icon-URL rewriter, and the CSP all point at
# upstream public services — bootRun alone "just works" with no nginx running.
#
# trip.tile.proxy-base-url: when proxy-enabled is true, prefix added to the
# proxy paths (/tiles/osm, /tiles/ndfd-wms, /wx-icons). Three operating
# modes:
#   * disabled (default)               — upstream URLs everywhere
#   * enabled, base empty              — relative paths; production behind
#                                         haproxy → nginx
#   * enabled, base http://localhost:8091 — absolute URLs for dev with the
#                                         nginx sidecar on a separate port
trip.tile.proxy-enabled=${TRIP_TILE_PROXY_ENABLED:false}
trip.tile.proxy-base-url=${TRIP_TILE_PROXY_BASE_URL:}

# Phase 5 of LOCAL_CACHING_HOSTING.md — self-hosted ORS routing engine.
#
# trip.local.ors.enabled: master switch. When false (the default), the
# RoutingDispatcher takes the disabled-fast-path and sends every request to
# public ORS, and the GeofabrikCoverageLoader does not run (so no Geofabrik
# fetch on startup). Flip to true once the trip-ors container is up.
#
# trip.local.ors.base-url: URL of the local ORS instance. Default points at
# the trip-ors container on forgotten_net; for dev with the sidecar
# published on host, set http://localhost:8082/ors.
#
# trip.local.ors.timeout-ms: connect + read timeout for local-ORS calls.
# Expiry triggers fallback to public ORS (one extra round trip of
# user-perceived latency, no error). Keep small — the fallback is the
# safety net.
#
# trip.routing.local-regions: comma-separated Geofabrik region slugs the
# loader seeds routing_coverage rows for. Phase 5b expands this list as
# coverage grows; the dispatch wrapper is region-agnostic.
#
# trip.routing.geofabrik-base-url: where to fetch .poly files from. Override
# only for tests (e.g. MockRestServiceServer fixture).
#
# trip.admin.refresh-token: shared secret the operator's curl supplies in
# the X-Admin-Token header to authorise /api/admin/refresh-coverage.
# Stopgap until USER_ACCOUNTS_PLAN.md defines a proper admin role; blank
# default = endpoint refuses every call (fail closed).
trip.local.ors.enabled=${TRIP_LOCAL_ORS_ENABLED:false}
trip.local.ors.base-url=${TRIP_LOCAL_ORS_BASE_URL:http://trip-ors:8082/ors}
trip.local.ors.timeout-ms=${TRIP_LOCAL_ORS_TIMEOUT_MS:3000}
# Geofabrik base used only for the legacy /api/admin/refresh-coverage tests
# (MockRestServiceServer fixture). Production fetches via the absolute URL
# stored per-pbf in pbf_files.geofabrik_url.
trip.routing.geofabrik-base-url=${TRIP_ROUTING_GEOFABRIK_BASE_URL:https://download.geofabrik.de/north-america/us}
trip.admin.refresh-token=${TRIP_ADMIN_REFRESH_TOKEN:}

# Phase 0 of ADMIN_CONSOLE.md — admin login for the operator console at /admin/.
#
# trip.admin.enabled: master switch. When true (the default),
# StartupConfigValidator requires both username and password to be non-blank
# and a separate /admin/** SecurityFilterChain is registered. Set false on a
# fresh checkout to skip the requirement and disable the console.
#
# trip.admin.username, trip.admin.password: credential for the single operator
# account. Password is supplied in plaintext via env and BCrypt-hashed in
# memory at startup; never written to disk or logged.
#
# trip.admin.refresh-token (above): legacy shared-secret header (X-Admin-Token)
# kept working for the production cron's curl call to /api/admin/refresh-coverage/{region}.
# Granted ROLE_ADMIN_TOKEN, which is allow-listed only on that one endpoint.
trip.admin.enabled=${TRIP_ADMIN_ENABLED:true}
trip.admin.username=${TRIP_ADMIN_USERNAME:}
trip.admin.password=${TRIP_ADMIN_PASSWORD:}

# Phase 1 of AI_ASSIST_PLAN.md — AI trip-planning assistant.
#
# trip.ai.assist.enabled: master switch. When true (the default),
# StartupConfigValidator requires trip.ai.enc-key to be set, and the
# /api/ai/** endpoints are active. Set false on a fresh checkout to skip the
# enc-key requirement and disable the feature.
#
# trip.ai.enc-key: Base64-encoded 32-byte (AES-256) key that encrypts users'
# provider API keys at rest (AiKeyCipher). Blank default because it's a
# per-environment secret — fail fast at boot when assist is enabled. Generate
# with: openssl rand -base64 32. Rotating it invalidates every stored API key.
#
# trip.ai.ollama-url: operator-set Ollama service URL. When set to a valid
# http/https URL, the Ollama provider is offered and that endpoint is used;
# blank/invalid disables Ollama. Operator-trusted (typically an internal
# address), so it bypasses the outbound SSRF guard that applies to user-
# supplied Custom base URLs.
trip.ai.assist.enabled=${TRIP_AI_ASSIST_ENABLED:true}
trip.ai.enc-key=${TRIP_AI_ENC_KEY:}
trip.ai.ollama-url=${TRIP_AI_OLLAMA_URL:}

# Phase 1b of AI_ASSIST_PLAN.md — provider endpoints + model discovery.
#
# trip.ai.openai-base-url / trip.ai.anthropic-base-url: server defaults for the
# hosted providers (override rarely needed). The Custom provider supplies its
# own base URL per config (subject to the SSRF guard); Ollama uses
# trip.ai.ollama-url above.
#
# trip.ai.anthropic-version: value of the anthropic-version header.
#
# trip.ai.connect-timeout-ms: TCP connect timeout for outbound AI calls — kept
# short so an unreachable provider fails fast.
#
# trip.ai.request-timeout-ms: response (read) timeout for outbound AI calls
# (model discovery + chat). Defaults generous because reasoning models
# (gpt-5.x, o-series) often generate for well over 30s; too short cancels the
# request after the model has already produced — and billed — the tokens, which
# surfaces as an intermittent 502. Raise it further for slow reasoning models.
trip.ai.openai-base-url=${TRIP_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
trip.ai.anthropic-base-url=${TRIP_AI_ANTHROPIC_BASE_URL:https://api.anthropic.com}
trip.ai.anthropic-version=${TRIP_AI_ANTHROPIC_VERSION:2023-06-01}
trip.ai.connect-timeout-ms=${TRIP_AI_CONNECT_TIMEOUT_MS:10000}
trip.ai.request-timeout-ms=${TRIP_AI_REQUEST_TIMEOUT_MS:240000}

# Phase 2 of AI_ASSIST_PLAN.md — the assist pipeline.
#
# trip.ai.max-waypoints: cap on how many locations from one AI response are
# geocoded and routed (the rest are dropped with a warning).
#
# trip.ai.assist-debug: when true, the assist response includes the generated
# prompt and the raw model text (for prompt tuning over curl). Keep false in
# production — it exposes the prompt/response in the API payload.
#
# trip.ai.geocode-retries: how many times to RETRY a per-location forward
# geocode that errors or returns no result (so attempts = retries + 1). Absorbs
# transient Geoapify hiccups that would otherwise drop a waypoint.
#
# trip.ai.geocode-retry-delay-seconds: delay between those retry attempts. The
# worst-case added latency for one assist request is roughly
# max-waypoints * retries * delay (only on failing lookups).
trip.ai.max-waypoints=${TRIP_AI_MAX_WAYPOINTS:25}
trip.ai.assist-debug=${TRIP_AI_ASSIST_DEBUG:false}
trip.ai.geocode-retries=${TRIP_AI_GEOCODE_RETRIES:1}
trip.ai.geocode-retry-delay-seconds=${TRIP_AI_GEOCODE_RETRY_DELAY_SECONDS:3}
