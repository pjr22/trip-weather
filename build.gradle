plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	// On-demand CVE scan of dependencies. Run with: ./gradlew dependencyCheckAnalyze
	// Reports written to build/reports/dependency-check-report.html. Set NVD_API_KEY to
	// avoid NVD rate-limiting on the first run (request one at https://nvd.nist.gov/developers/request-an-api-key).
	id 'org.owasp.dependencycheck' version '12.1.0'
}

group = 'com.pjr22'
version = '0.0.1-SNAPSHOT'
description = 'Trip Weather application for forcasting weather along a driven route'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Versions for dependencies not managed by the Spring Boot BOM.
// Spring-Boot-managed deps below stay version-less on purpose; add new non-BOM versions here.
ext {
	bucket4jVersion = '8.14.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.postgresql:postgresql'
	implementation 'org.hibernate.orm:hibernate-spatial'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation "com.bucket4j:bucket4j_jdk17-core:${bucket4jVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

   compileOnly 'org.projectlombok:lombok'
   annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
